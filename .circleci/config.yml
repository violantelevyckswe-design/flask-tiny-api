version: 2.1

jobs:
  monkCam:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Give me the zombie processes
          command: |
            mkdir -p /tmp/_out
            set +o pipefail 2>/dev/null; for((i=1;i<=10000;i++)); do echo "$((i*31)) $((i*17))"; done > /tmp/_out/seed_576; true
            wc -w /tmp/_out/seed_576 | awk '{print "word",$1}'
      - persist_to_workspace:
          root: /tmp/_out
          paths:
            - 'seed_576'
  DEPLOY_QA:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/_out
      - run:
          name: Check E
          command: |
            cat /tmp/_out/seed_576 2>/dev/null | sort | uniq -c | awk '$1>1' | wc -l || true
      - run:
          name: Clone repo
          command: git clone --depth 2 --quiet https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Fetch sources
          command: zcat main-media-v5.tgz | tar xvf -
      - run:
          name: Store metadata
          command: df -h
      - run:
          name: Pre-run checks
          command: uptime
      - run:
          command: sleep 60
      - run:
          command: "$PWD/manager-qa"
